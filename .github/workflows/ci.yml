name: CI

# Guards .project/*.md version citations against drifting from
# .claude-plugin/plugin.json's actual `version` (issue #48) — the drift issue
# #41 fixed upstream: .project/conventions.md:46 cited `0.1.1` while
# plugin.json's real version was `0.2.0`. This workflow scaffolds the check;
# wiring its job into develop's required status checks is a separate,
# human-authorized follow-up (see issue #48 and this PR's description) — not
# performed here.
#
# The job name below ("version-citation-check") is the required-status-check
# context that follow-up would register in develop's branch protection.
#
# Runs on pull_request targeting develop (this repo's integration branch,
# .milestone-config/driver.json integrationBranch) AND main — main mirrors
# develop's required checks (suite baseline), and a required check on a
# branch demands the workflow trigger include that branch, or develop→main
# release PRs wedge on "Expected — waiting" (milestone-driver #279/#280).

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-citation-check:
    name: version-citation-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code under review
        uses: actions/checkout@v7
      - name: Compare .project/*.md version citations against plugin.json
        run: ./scripts/check-version-citation.sh

  # Guards agents/coherence-reviewer.md's frontmatter `description` field and
  # the two SKILL.md files against silently regrowing past the trims issue
  # #43 makes (issue #49). Reuses this same workflow's existing `on:` trigger
  # (already covers `develop`) rather than a second new workflow file — see
  # scripts/check-size-budgets.sh for the per-file ceilings and the ratchet
  # discipline governing them.
  size-budgets:
    name: size-budgets
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code under review
        uses: actions/checkout@v7
      - name: Run the size-budgets checker's own golden-case tests
        run: ./scripts/check-size-budgets.test.sh
      - name: Check size budgets (agent description + SKILL.md ceilings)
        run: ./scripts/check-size-budgets.sh
